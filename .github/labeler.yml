# Labels pull requests from the files they change (pr-labeler.yml). The labels also
# group the generated release notes (release.yml).

# The .env parser and ${VAR} expansion.
'parser':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/libs/parser/**'
          - 'src/libs/expand/**'

# createEnv() and the validators.
'schema':
  - changed-files:
      - any-glob-to-any-file: 'src/libs/schema/**'

# Node-only file loading (dotvar/node, dotvar/config).
'node':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/libs/node/**'
          - 'src/node.ts'
          - 'src/config.ts'

'security':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/utils/security/**'
          - 'SECURITY.md'

'types':
  - changed-files:
      - any-glob-to-any-file: 'src/types/**'

'utils':
  - changed-files:
      - any-glob-to-any-file: 'src/utils/**'

# Any non-test source change, so release notes can tell library changes apart.
'source':
  - changed-files:
      - all-globs-to-any-file:
          - 'src/**/*.ts'
          - '!src/**/*.test.ts'

'tests':
  - changed-files:
      - any-glob-to-any-file: 'src/**/*.test.ts'

'e2e':
  - changed-files:
      - any-glob-to-any-file: 'e2e/**'

'benchmarks':
  - changed-files:
      - any-glob-to-any-file: 'bench/**'

'ci':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/actions/**'
          - '.github/dependabot.yml'
          - '.github/labeler.yml'
          - '.github/release.yml'

'documentation':
  - changed-files:
      - any-glob-to-any-file: '**/*.md'

'tooling':
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'yarn.lock'
          - 'tsconfig*.json'
          - '.swcrc'
          - '.yarnrc.yml'
          - '.nvmrc'
          - '.editorconfig'
          - '.prettierrc.ts'
          - '.prettierignore'
          - 'eslint.config.ts'
          - 'vitest.config.ts'
          - 'scripts/**'
          - '.claude/**'
