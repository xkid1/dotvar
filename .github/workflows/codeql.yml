name: CodeQL

# Static analysis for security vulnerabilities and code-quality issues.
# Results appear under Security → Code scanning, and as annotations on pull requests.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new CodeQL queries also run against unchanged code.
    - cron: '27 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to code scanning
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # TypeScript/JavaScript source, tests, e2e harness and build scripts.
          - language: javascript-typescript
          # The workflows themselves (e.g. script injection, excessive permissions).
          - language: actions
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Security queries plus maintainability/correctness ("code quality") queries.
          queries: security-and-quality
          config: |
            paths-ignore:
              - dist
              - coverage
              - node_modules

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
