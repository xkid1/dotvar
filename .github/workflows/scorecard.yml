name: Scorecard

# OpenSSF Scorecard: rates the repo's supply-chain security practices (branch
# protection, pinned dependencies, token permissions, signed releases, ...).
# Results appear under Security → Code scanning and on the README badge.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

# Scorecard refuses to publish results from a workflow with top-level write access.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to code scanning
      id-token: write # publish results to the public Scorecard API (for the badge)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
