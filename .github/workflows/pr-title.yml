name: PR title

# The PR title becomes its entry in the generated release notes (and the commit
# message, if squash-merged). Enforce Conventional Commits, e.g. `fix(server): ...`
# (common scopes: parser, schema, node, security, types, utils, deps, ci).

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  lint-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      # Reads the title only; no checkout, so pull_request_target is safe here.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
